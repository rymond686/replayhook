name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feat/phase1-replayhook
      - feat/github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /replayhook
      NEXT_PUBLIC_SITE_URL: https://rymond686.github.io/replayhook
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: https://etvtfqpuonhlfhzyqqyf.supabase.co/functions/v1/track
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - name: Install, test, and export
        run: |
          npm ci
          npm test
          npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: saas/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
